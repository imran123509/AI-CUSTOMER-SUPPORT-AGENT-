# Apply with: kubectl apply -f secret.example.yaml -n unfyd-pivot
# Replace placeholders before committing to a secret store (Sealed Secrets, Vault, AWS SM, etc.).
apiVersion: v1
kind: Secret
metadata:
  name: unfyd-pivot-secrets
  namespace: unfyd-pivot
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME_LONG_RANDOM"
  PASSWORD_PEPPER: "REPLACE_ME_PEPPER"
  POSTGRES_USER: "unfyd"
  POSTGRES_PASSWORD: "REPLACE_ME"
  DATABASE_URL: "postgresql+asyncpg://unfyd:REPLACE_ME@postgres:5432/unfyd_pivot"
  SYNC_DATABASE_URL: "postgresql+psycopg://unfyd:REPLACE_ME@postgres:5432/unfyd_pivot"
  GEMINI_API_KEY: "REPLACE_ME"
