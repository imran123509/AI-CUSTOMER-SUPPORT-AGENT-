apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, namespace: unfyd-pivot }
spec:
  replicas: 2
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      containers:
        - name: worker
          image: unfyd/pivot-backend:latest
          command: ["python", "-m", "app.workers.runner"]
          envFrom:
            - configMapRef: { name: unfyd-pivot-config }
            - secretRef:    { name: unfyd-pivot-secrets }
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
