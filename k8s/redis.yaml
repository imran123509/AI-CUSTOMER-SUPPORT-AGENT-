apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: unfyd-pivot }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          args: ["redis-server", "--appendonly", "yes"]
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: unfyd-pivot }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
