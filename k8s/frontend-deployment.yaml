apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: unfyd-pivot }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: unfyd/pivot-frontend:latest
          ports: [{ containerPort: 3000 }]
          env:
            - { name: NEXT_PUBLIC_API_URL, value: "https://api.unfyd.io" }
            - { name: NEXT_PUBLIC_WS_URL,  value: "wss://api.unfyd.io/ws" }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: unfyd-pivot }
spec:
  selector: { app: frontend }
  ports: [{ port: 3000, targetPort: 3000 }]
