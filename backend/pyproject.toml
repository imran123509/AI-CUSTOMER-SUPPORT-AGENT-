[project]
name = "unfyd-pivot-backend"
version = "0.1.0"
description = "UNFYD.PIVOT — AI Customer Support Backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["app"]
